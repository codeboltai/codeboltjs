name: e2b-remote-provider
unique_id: e2b-remote-provider
version: 2.0.12
description: E2B Remote Provider for CodeBolt (plugin-based)
type: provider
entrypoint: dist/index.js
runtime: node
config:
  pluginPort: 3100
  e2bApiKey: ""
  sandboxTemplate: "k4u1tkiz5x2hpj0x4l1x"
  desktopSandboxTemplate: "w017ynr7hiro2ufayd7l"
  autoStopInterval: 0
capabilities:
  screenAccess:
    preview: true
    interaction: true
    transports:
      - vnc
  bootstrapTypes:
    - git_revision
  syncModes:
    - git
    - workspace_sync
  mergeStrategies:
    - workspace_sync
  rmrSourceTypes:
    - workspace_sync
  defaultRmrSourceType: workspace_sync
