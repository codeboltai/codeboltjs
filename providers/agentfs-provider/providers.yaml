name: agentfs-provider
unique_id: agentfs-provider
version: 1.0.0
description: Filesystem-only Turso AgentFS provider for CodeBolt
entrypoint: dist/index.js
config:
  agentFSSdkPackage: agentfs-sdk
  agentFSIdPrefix: codebolt
  executionMode: local_thread_pool
  syncMode: workspace_sync
  mergeStrategy: workspace_sync
  supportedSyncModes:
    - workspace_sync
  supportedMergeStrategies:
    - workspace_sync
  timeouts:
    wsConnection: 10000
    cleanup: 15000
