name: agentfs-provider
unique_id: agentfs-provider
version: 1.0.0
description: Copy-on-write local filesystem provider for CodeBolt
entrypoint: dist/index.js
config:
  executionMode: local_thread_pool
  filesystem:
    type: local
  syncMode: workspace_sync
  mergeStrategy: workspace_sync
  supportedSyncModes:
    - workspace_sync
  supportedMergeStrategies:
    - workspace_sync
