name: agentfs-provider
unique_id: agentfs-provider
version: 1.0.0
description: Copy-on-write local filesystem provider for CodeBolt
type: provider
entrypoint: dist/index.js
runtime: node
author: ravi
supportedBootstrapTypes:
  - git_revision
config:
  executionMode: local_thread_pool
  filesystem:
    type: local
  syncMode: git
  mergeStrategy: git
  supportedSyncModes:
    - git
    - workspace_sync
  supportedMergeStrategies:
    - git
    - workspace_sync
