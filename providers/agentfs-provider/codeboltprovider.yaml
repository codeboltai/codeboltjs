name: agentfs-provider
unique_id: agentfs-provider
version: 1.4.2
description: Mounted AgentFS copy-on-write overlay provider for CodeBolt
type: provider
entrypoint: dist/index.js
runtime: node
author: ravi
config:
  executionMode: local_thread_pool
  filesystem:
    type: provider
  timeouts:
    providerStart: 180000
  syncMode: git
  mergeStrategy: git
  supportedSyncModes:
    - git
  supportedMergeStrategies:
    - git
