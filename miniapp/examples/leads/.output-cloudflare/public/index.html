<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Depository</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17202a;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;color:white;background:#145a4a}header h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:#d9eee8}main{display:grid;grid-template-columns:320px 1fr;gap:24px;max-width:1100px;margin:28px auto;padding:0 20px}section{background:white;border:1px solid #dce3e5;border-radius:6px;padding:20px}h2{margin:0 0 16px;font-size:16px}form{display:grid;gap:12px}label{display:grid;gap:5px;color:#4d5b61;font-size:13px}input{width:100%;padding:9px 10px;border:1px solid #b9c4c8;border-radius:4px;font:inherit}button{border:0;border-radius:4px;padding:10px 14px;color:white;background:#16735f;font-weight:600;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #e4e9eb;text-align:left;font-size:14px}th{color:#5d696e;font-size:12px;text-transform:uppercase}#empty{color:#6c777b}@media(max-width:760px){main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Lead Depository</h1><p>Temporary shared state for lead research agents</p></header>
  <main><section><h2>Add lead</h2><form id="lead-form"><label>Name<input name="name" required></label><label>Company<input name="company" required></label><label>Email<input name="email" type="email"></label><button>Add lead</button></form></section><section><h2>Discovered leads</h2><p id="empty">No leads have been deposited.</p><table hidden><thead><tr><th>Name</th><th>Company</th><th>Email</th></tr></thead><tbody></tbody></table></section></main>
  <script>
    const table=document.querySelector('table'),body=document.querySelector('tbody'),empty=document.querySelector('#empty');
    async function refresh(){const data=await fetch('/api/leads').then(r=>r.json());body.replaceChildren(...data.documents.map(lead=>{const row=document.createElement('tr');for(const value of[lead.name,lead.company,lead.email||'']){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}return row}));table.hidden=!data.documents.length;empty.hidden=!!data.documents.length}
    document.querySelector('#lead-form').addEventListener('submit',async event=>{event.preventDefault();const input=Object.fromEntries(new FormData(event.currentTarget));await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(input)});event.currentTarget.reset();await refresh()});refresh();
  </script>
</body>
</html>
