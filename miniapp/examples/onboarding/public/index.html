<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Onboarding</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#20252b;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;color:white;background:#293241}header h1{margin:0;font-size:22px;letter-spacing:0}header p{margin:6px 0 0;color:#dbe1e8}main{max-width:980px;margin:28px auto;padding:0 20px}section{background:white;border:1px solid #dddcd8;border-radius:6px;padding:20px;margin-bottom:18px}form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:grid;gap:5px;color:#545d66;font-size:13px}input{padding:9px 10px;border:1px solid #b9bec3;border-radius:4px;font:inherit}button{border:0;border-radius:4px;padding:10px 14px;color:white;background:#c44f34;font-weight:600;cursor:pointer}article{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e8e5e1}article:last-child{border:0}h2,h3,p{margin-top:0}h2{font-size:16px}h3{margin-bottom:4px;font-size:15px}article p{margin-bottom:0;color:#67717a;font-size:13px}@media(max-width:680px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Employee Onboarding</h1><p>Shared onboarding progress for people operations</p></header>
  <main><section><h2>Add employee</h2><form id="employee-form"><label>Name<input name="name" required></label><label>Role<input name="role" required></label><button>Add employee</button></form></section><section><h2>Active onboarding</h2><div id="employees">No employees in onboarding.</div></section></main>
  <script>
    const list=document.querySelector('#employees');
    async function refresh(){const data=await fetch('/api/employees').then(r=>r.json());if(!data.documents.length){list.textContent='No employees in onboarding.';return}list.replaceChildren(...data.documents.map(employee=>{const item=document.createElement('article'),text=document.createElement('div'),title=document.createElement('h3'),detail=document.createElement('p'),button=document.createElement('button');title.textContent=employee.name;detail.textContent=`${employee.role} - ${employee.completed.length} steps complete`;button.textContent='Complete orientation';button.onclick=async()=>{await fetch('/api/complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({employeeId:employee.id,step:'orientation'})});await refresh()};text.append(title,detail);item.append(text,button);return item}))}
    document.querySelector('#employee-form').addEventListener('submit',async event=>{event.preventDefault();const input=Object.fromEntries(new FormData(event.currentTarget));await fetch('/api/employees',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(input)});event.currentTarget.reset();await refresh()});refresh();
  </script>
</body>
</html>
