title: Creation Agent
version: 0.1.0
unique_id: creation-agent
initial_message: Tell me what CodeBolt extension you want to create or update: agent, plugin, dynamic plugin, provider, or ActionBlock. I will show you a plan for confirmation, resolve the right SDK calls and platform contracts, generate the files, and validate the result.
description: Creates and updates CodeBolt agents, plugins, dynamic plugins, providers, and ActionBlocks through a phased workflow - plan confirmation, API/contract resolution, target-specific code generation, and validation.
tags:
  - code-generation
  - extension-creation
  - codebolt
longDescription: |
  Creation Agent is a CodeBolt extension-authoring assistant built as an orchestrator
  over phase tools. It plans the requested agent, plugin, dynamic plugin, provider,
  or ActionBlock at capability level and shows the plan for user confirmation, resolves
  every capability to concrete SDK APIs and target-specific platform contracts, then
  routes to the matching writer tool. Agent projects still use deterministic scaffolding
  and final verify_agent checks; other extension targets use target-aware writers with
  scoped TypeScript declarations, API-usage checks, and validation reporting.
avatarSrc: https://placehold.co/200x200
avatarFallback: CA
metadata:
  agent_routing:
    worksonblankcode: true
    worksonexistingcode: true
    supportedlanguages:
      - typescript
      - javascript
    supportedframeworks:
      - codebolt-agent
    supportRemix: true
  defaultagentllm:
    strict: true
    modelorder:
      - gpt-4.1
      - gpt-4-turbo
      - claude-3.5-sonnet
      - group.codingmodels
  sdlc_steps_managed:
    - name: implementation
      example_instructions:
        - create an agent that reviews pull requests
        - create a plugin that registers a workspace command
        - create a dynamic plugin that discovers tools at runtime
        - create a provider that implements an LLM streaming contract
        - create an ActionBlock that validates input and returns structured output
actions:
  - name: Create Extension
    description: Creates a CodeBolt agent, plugin, dynamic plugin, provider, or ActionBlock from a natural-language request.
    detailDescription: Designs, writes, and validates a target-specific CodeBolt extension package using API docs index retrieval.
    actionPrompt: Describe the CodeBolt extension you want to create.
supportRemix: true
author: CodeBolt
verification:
  enabled: true
  checks:
    lint: true
    test: true
    build: true
    typecheck: true
  timeout: 60000
  skipOnNoConfig: true
  skipForNonCodeTasks: false
  maxRetries: -1
