  - name: Test API Docs Index Tools
    description: Calls every safe api-docs-index API/tool action and reports pass/fail results.
    detailDescription: Use this to validate search_api_docs, get_api_spec, module lookups, examples, authoring, validation, and sandbox log tools.
    actionPrompt: Test all API docs index tools and report whether they return correct results.
