title: API Docs Index Tool Tester
version: 0.1.0
unique_id: api-docs-index-tool-tester
initial_message: API Docs Index Tool Tester is ready to validate API docs index tools.
description: Runs smoke tests against @codebolt/api-docs-index APIs and local tool actions.
tags:
  - testing
